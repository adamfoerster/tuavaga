org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# iOS targets only build on macOS; elsewhere they are skipped without warnings.
kotlin.native.ignoreDisabledTargets=true

# Single source of the app version (SemVer). Bump on every change and add a CHANGELOG.md entry;
# iosApp/Configuration/Config.xcconfig (MARKETING_VERSION) must match. `./gradlew verifyVersion` checks it.
app.version=0.8.2

android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
